<!doctype html>
<html lang="en">
        <head>
                <meta charset="utf-8" />
                <!-- viewport-fit=cover unlocks env(safe-area-inset-*) on notched devices -->
                <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
                <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
                <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
                <!-- latin subset (48 KB) of the Inter variable font, self-hosted and
                     preloaded so first paint uses it instead of a fallback + swap -->
                <link
                        rel="preload"
                        href="%sveltekit.assets%/fonts/inter-latin-var-wght.woff2"
                        as="font"
                        type="font/woff2"
                        crossorigin="anonymous"
                />
                <!-- Apply the stored theme before first paint — see
                     src/lib/demo/theme.svelte.ts for the hydrated twin. -->
                <script>
                        try {
                                var t = localStorage.getItem('sui-theme');
                                if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
                                        document.documentElement.classList.add('dark');
                        } catch (e) {}
                </script>
                %sveltekit.head%
        </head>
        <body data-sveltekit-preload-data="hover">
                <div style="display: contents">%sveltekit.body%</div>
        </body>
</html>
